<!doctype html>
<html lang="en"><head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#171716"><meta name="color-scheme" content="dark"><title>Claude Mobile Pro</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--bg:#171716;--panel:#242423;--panel2:#30302f;--text:#f2f0eb;--muted:#aaa8a2;--accent:#d97757}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea,select{font:inherit}button{color:inherit;cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}.top{height:64px;min-height:64px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 14px}.brand{font-family:Georgia,serif;text-align:center;font-size:19px}.icon{width:44px;height:44px;border:0;background:transparent;border-radius:14px;display:grid;place-items:center}.hamb span{display:block;width:29px;height:2px;background:#c9c6be;margin:6px 0}.ghost{width:34px;height:34px;border:2px solid #eee;border-radius:50%;position:relative;justify-self:end}.ghost:before,.ghost:after{content:"";position:absolute;width:4px;height:4px;background:#eee;border-radius:50%;top:10px}.ghost:before{left:8px}.ghost:after{right:8px}.ghost i{position:absolute;width:12px;height:7px;border-bottom:2px solid #eee;border-radius:0 0 10px 10px;left:9px;top:15px}.home{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px 190px;overflow:hidden}.mark{width:68px;height:68px;margin-bottom:18px;display:grid;place-items:center}.spark{position:relative;width:56px;height:56px}.ray{position:absolute;left:26px;top:0;width:5px;height:56px;border-radius:5px;background:var(--accent)}.ray:nth-child(2){transform:rotate(30deg)}.ray:nth-child(3){transform:rotate(60deg)}.ray:nth-child(4){transform:rotate(90deg)}.ray:nth-child(5){transform:rotate(120deg)}.ray:nth-child(6){transform:rotate(150deg)}.ray:nth-child(7){transform:rotate(180deg)}.ray:nth-child(8){transform:rotate(210deg)}.ray:nth-child(9){transform:rotate(240deg)}.ray:nth-child(10){transform:rotate(270deg)}.ray:nth-child(11){transform:rotate(300deg)}.ray:nth-child(12){transform:rotate(330deg)}h1{font-family:Georgia,serif;font-size:40px;line-height:1.1;letter-spacing:-1.7px;text-align:center;margin:0 0 10px}.sub{font-size:16px;color:var(--muted);text-align:center}.chat{display:none;flex:1;min-height:0;overflow:auto;padding:18px 18px 190px}.msg{display:flex;margin:12px 0}.msg.user{justify-content:flex-end}.bubble{max-width:88%;padding:12px 15px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.52;font-size:16px}.user .bubble{background:var(--panel2)}.assistant .bubble{max-width:95%;padding-left:2px}.composerWrap{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:0 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 24%,var(--bg))}.status{font-size:12px;color:var(--muted);margin:0 8px 7px;display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#6fbf73}.composer{background:var(--panel);border:1px solid #323230;border-radius:29px;padding:14px 13px 11px;box-shadow:0 10px 38px #0005}textarea{display:block;width:100%;height:46px;max-height:125px;border:0;outline:0;resize:none;background:transparent;color:var(--text);font-size:18px;line-height:1.4;padding:3px 7px}textarea::placeholder{color:#aaa8a2}.row{display:flex;align-items:center;gap:9px;margin-top:7px}.left{display:flex;align-items:center;gap:9px;flex:1;min-width:0}.round{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:50%;background:var(--panel2);font-size:28px}.model{height:44px;border:0;outline:0;background:var(--panel2);border-radius:23px;padding:0 12px;color:#eee;font-weight:650;font-size:14px;max-width:170px}.voice,.send{width:52px;height:52px;flex:0 0 52px;border:0;border-radius:50%}.voice{background:#f5f5f3;color:#111}.send{background:var(--accent);font-size:25px}.send:disabled{opacity:.45}.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:24px}.wave b{width:3px;border-radius:3px;background:#111}.wave b:nth-child(1){height:9px}.wave b:nth-child(2){height:17px}.wave b:nth-child(3){height:23px}.wave b:nth-child(4){height:13px}.wave b:nth-child(5){height:19px}.attachment{display:none;margin:7px 3px 0;padding:8px 11px;border-radius:13px;background:var(--panel2);font-size:12px;color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file{display:none}.drawer{position:fixed;inset:0;background:#0009;display:none;z-index:10}.drawer.open{display:block}.side{width:min(84%,350px);height:100%;background:#20201f;padding:18px 16px}.sideTop{display:flex;justify-content:space-between;align-items:center}.sideTop .brand{text-align:left}.side h2{font-family:Georgia,serif;font-size:24px;margin:18px 10px 22px}.nav,.new{display:block;width:100%;border:0;text-align:left;padding:14px 13px;border-radius:13px;font-size:16px;background:transparent}.nav.active,.nav:active,.new{background:var(--panel2)}.new{margin-top:16px;text-align:center;font-weight:700}.note{margin:28px 10px;color:#92908b;font-size:12px;line-height:1.6}.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;background:var(--panel2);padding:10px 14px;border-radius:14px;font-size:13px;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:380px){h1{font-size:34px}.model{max-width:145px}.voice,.send{width:48px;height:48px;flex-basis:48px}}
</style></head><body>
<div class="app"><header class="top"><button class="icon" id="menu"><span class="hamb"><span></span><span></span><span></span></span></button><div class="brand">Claude</div><button class="icon ghost" id="profile"><i></i></button></header>
<main class="home" id="home"><div class="mark"><div class="spark"><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i></div></div><h1>Up late, Tamil?</h1><div class="sub">What can I help you with today?</div></main>
<section class="chat" id="chat"></section><div class="composerWrap"><div class="status"><span class="dot"></span><span id="status">Checking Puter AI…</span></div><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Chat with Claude..." autocomplete="off"></textarea><div class="attachment" id="attachment"></div><input class="file" id="file" type="file" accept="image/*,.pdf,.txt,.md,.json,.csv" multiple><div class="row"><div class="left"><button type="button" class="round" id="attach">+</button><select class="model" id="model"><option value="gpt-5.6-luna">GPT-5.6 Luna</option><option value="claude-sonnet-4-6">Sonnet 4.6</option><option value="claude-opus-4-8">Opus 4.8</option><option value="claude-haiku-4-5">Haiku 4.5</option></select></div><button type="button" class="voice" id="voice"><span class="wave"><b></b><b></b><b></b><b></b><b></b></span></button><button type="submit" class="send" id="send">➤</button></div></form></div></div>
<div class="drawer" id="drawer"><aside class="side"><div class="sideTop"><div class="brand">Claude</div><button class="icon" id="close">×</button></div><h2>Claude Mobile Pro</h2><button class="nav active" data-page="chat">✦ New chat</button><button class="nav" data-page="projects">▣ Projects</button><button class="nav" data-page="plugins">◇ Plugins</button><button class="nav" data-page="github">⌘ GitHub</button><button class="nav" data-page="settings">⚙ Settings</button><button class="new" id="newChat">+ New conversation</button><div class="note">Powered by Puter.js AI.</div></aside></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),home=$('home'),chat=$('chat'),input=$('input'),model=$('model'),form=$('form'),drawer=$('drawer'),file=$('file'),attachment=$('attachment'),status=$('status'),send=$('send'),toast=$('toast');let messages=[],selectedFiles=[];
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2600)}
function add(role,text){const d=document.createElement('div');d.className='msg '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;d.appendChild(b);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return b}
function start(){home.style.display='none';chat.style.display='block'}
function reset(){messages=[];chat.innerHTML='';home.style.display='flex';chat.style.display='none';input.value='';input.style.height='46px'}
async function ensurePuter(){if(typeof puter==='undefined'||!puter.ai||typeof puter.ai.chat!=='function')throw new Error('Puter AI SDK did not load. Check internet connection.');if(puter.auth&&typeof puter.auth.isSignedIn==='function'&&!puter.auth.isSignedIn()){status.textContent='Puter sign-in required…';if(puter.ui&&typeof puter.ui.authenticateWithPuter==='function'){await puter.ui.authenticateWithPuter()}else if(puter.auth.signIn){await puter.auth.signIn()}if(puter.auth.isSignedIn&&!puter.auth.isSignedIn())throw new Error('Puter sign-in was cancelled.')} }
async function callAI(){const requested=model.value;try{return await Promise.race([puter.ai.chat(messages,false,{model:requested,stream:false,normalize:true}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('AI request timed out after 30 seconds')),30000))])}catch(e){if(requested!=='gpt-5.6-luna'){status.textContent='Retrying with GPT-5.6 Luna…';return await Promise.race([puter.ai.chat(messages,false,{model:'gpt-5.6-luna',stream:false,normalize:true}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('AI request timed out after 30 seconds')),30000))])}throw e}}
async function sendMessage(text){if(!text||send.disabled)return;start();input.value='';input.style.height='46px';const content=text+(selectedFiles.length?'\n\n[Attached files: '+selectedFiles.map(f=>f.name).join(', ')+']':'');selectedFiles=[];attachment.style.display='none';messages.push({role:'user',content});add('user',text);const bubble=add('assistant','Thinking…');status.textContent='Connecting to AI…';send.disabled=true;try{await ensurePuter();status.textContent='Generating…';const res=await callAI();let out='';if(res&&res.message){out=typeof res.message.content==='string'?res.message.content:(Array.isArray(res.message.content)?res.message.content.filter(x=>x&&x.type==='text').map(x=>x.text||'').join(''):String(res.message.content||''))}else if(typeof res==='string')out=res;else out=JSON.stringify(res);if(!out.trim())throw new Error('AI returned an empty response');bubble.textContent=out;messages.push({role:'assistant',content:out});status.textContent='Puter AI ready'}catch(err){bubble.textContent='AI error: '+(err?.message||String(err));status.textContent='AI error — tap Send to retry';showToast(err?.message||'AI request failed');console.error(err)}finally{send.disabled=false}}
form.addEventListener('submit',e=>{e.preventDefault();sendMessage(input.value.trim())});input.addEventListener('input',()=>{input.style.height='46px';input.style.height=Math.min(input.scrollHeight,125)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});$('attach').onclick=()=>file.click();file.onchange=()=>{selectedFiles=[...file.files];if(selectedFiles.length){attachment.textContent='📎 '+selectedFiles.map(f=>f.name).join(', ');attachment.style.display='block';showToast(selectedFiles.length+' file(s) selected')}};$('voice').onclick=()=>{if(window.AndroidBridge?.startVoice){AndroidBridge.startVoice();showToast('Listening in Tamil…')}else showToast('Voice unavailable')};window.setVoiceText=t=>{if(t){input.value=(input.value+' '+t).trim();input.dispatchEvent(new Event('input'))}};$('menu').onclick=()=>drawer.classList.add('open');$('profile').onclick=()=>drawer.classList.add('open');$('close').onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};$('newChat').onclick=()=>{drawer.classList.remove('open');reset()};document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{drawer.classList.remove('open');if(n.dataset.page==='chat')reset();else showToast(n.textContent.trim()+' coming next')});
window.addEventListener('load',async()=>{try{if(typeof puter==='undefined')throw new Error('Puter SDK not loaded');status.textContent='Puter AI ready';if(puter.ai.listModels){const list=await puter.ai.listModels();const ids=new Set((list||[]).map(x=>x.id));[...model.options].forEach(o=>{if(!ids.has(o.value)&&o.value!=='gpt-5.6-luna')o.disabled=true});if(!ids.has(model.value)&&ids.has('gpt-5.6-luna'))model.value='gpt-5.6-luna'} }catch(e){status.textContent='Puter AI unavailable';console.error(e)}});
</script></body></html>
