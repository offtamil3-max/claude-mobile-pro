<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0f1012"><title>Claude Mobile Pro</title><script src="https://js.puter.com/v2/"></script><style>body{margin:0;background:#0f1012;color:#f4f2ee;font-family:system-ui,-apple-system,sans-serif;height:100vh}main{height:100%;display:flex;flex-direction:column}header{padding:16px;border-bottom:1px solid #2b2e34;font-weight:700}#chat{flex:1;overflow:auto;padding:16px}.m{margin:12px 0;white-space:pre-wrap;line-height:1.5}.u{text-align:right}.b{display:inline-block;padding:11px 14px;border-radius:16px;background:#202329;max-width:90%;text-align:left}.a{background:transparent}.bar{display:flex;gap:8px;padding:10px;background:#17191d}.bar textarea{flex:1;background:#202329;color:#fff;border:1px solid #2b2e34;border-radius:16px;padding:12px;resize:none}.bar button{width:48px;border:0;border-radius:14px;background:#d97757;color:#fff;font-weight:700}select{background:#202329;color:#fff;border:1px solid #2b2e34;border-radius:10px;padding:6px;margin-left:8px}</style></head><body><main><header>Claude Mobile Pro <select id="model"><option>claude-sonnet-4-6</option><option>claude-opus-4-1</option><option>claude-haiku-4-5</option></select></header><section id="chat"><div class="m a">Hello! I'm Claude Mobile Pro. Ask me anything.</div></section><form class="bar" id="form"><textarea id="input" rows="1" placeholder="Message Claude..."></textarea><button>➤</button></form></main><script>const chat=document.getElementById('chat'),input=document.getElementById('input'),model=document.getElementById('model');let messages=[];function add(role,text){const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');const b=document.createElement('span');b.className='b';b.textContent=text;d.appendChild(b);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return b}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';messages.push({role:'user',content:text});add('user',text);const b=add('assistant','');try{const r=await puter.ai.chat(messages,{model:model.value,stream:true});let out='';for await(const p of r){if(p.type==='text'){out+=p.text;b.textContent=out;chat.scrollTop=chat.scrollHeight}}messages.push({role:'assistant',content:out})}catch(err){b.textContent='Error: '+err.message}};</script></body></html>
