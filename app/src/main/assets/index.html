<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Claude Mobile Pro</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--bg:#171717;--panel:#242424;--panel2:#2d2d2d;--text:#f2f0eb;--muted:#a8a49d;--accent:#d97757;--line:#303030}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}button{color:inherit}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.035)}
.icon{width:42px;height:42px;border:0;background:transparent;border-radius:14px;display:grid;place-items:center;font-size:28px}.icon:active{background:#242424}.hamb span{display:block;width:29px;height:2px;background:#c7c3ba;margin:6px 0;border-radius:2px}
.ghost{width:42px;height:42px;border-radius:50%;border:2px solid #eee;background:transparent;position:relative}.ghost:before,.ghost:after{content:"";position:absolute;width:4px;height:4px;background:#eee;border-radius:50%;top:14px}.ghost:before{left:11px}.ghost:after{right:11px}.ghost i{position:absolute;width:13px;height:7px;border-bottom:2px solid #eee;border-radius:0 0 10px 10px;left:12px;top:20px}
.brand{font-family:Georgia,serif;font-size:20px;letter-spacing:-.3px;opacity:.96}.home{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:60px 22px 150px}.mark{width:74px;height:74px;display:grid;place-items:center;margin-top:12vh;margin-bottom:25px}.spark{position:relative;width:58px;height:58px}.ray{position:absolute;left:27px;top:0;width:5px;height:58px;border-radius:5px;background:var(--accent);transform-origin:50% 50%}.ray:nth-child(2){transform:rotate(30deg)}.ray:nth-child(3){transform:rotate(60deg)}.ray:nth-child(4){transform:rotate(90deg)}.ray:nth-child(5){transform:rotate(120deg)}.ray:nth-child(6){transform:rotate(150deg)}.ray:nth-child(7){transform:rotate(180deg)}.ray:nth-child(8){transform:rotate(210deg)}.ray:nth-child(9){transform:rotate(240deg)}.ray:nth-child(10){transform:rotate(270deg)}.ray:nth-child(11){transform:rotate(300deg)}.ray:nth-child(12){transform:rotate(330deg)}
.greeting{font-family:Georgia,serif;font-size:39px;line-height:1.12;text-align:center;letter-spacing:-1.5px;margin-bottom:12px}.sub{font-size:15px;color:var(--muted);text-align:center;max-width:310px;line-height:1.5}.chat{display:none;flex:1;overflow:auto;padding:24px 18px 170px}.msg{display:flex;margin:12px 0}.msg.user{justify-content:flex-end}.bubble{max-width:86%;padding:13px 16px;border-radius:20px;white-space:pre-wrap;line-height:1.5;font-size:16px}.assistant .bubble{background:transparent;padding-left:2px}.user .bubble{background:#303030}
.composerWrap{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 20%)}.composer{background:#242424;border:1px solid #2f2f2f;border-radius:30px;padding:17px 14px 12px;box-shadow:0 8px 35px rgba(0,0,0,.25)}textarea{width:100%;height:48px;max-height:130px;border:0;outline:0;resize:none;background:transparent;color:var(--text);font-size:18px;padding:3px 5px}.row{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.left{display:flex;align-items:center;gap:10px}.round{width:43px;height:43px;border:0;border-radius:50%;background:#303030;display:grid;place-items:center;font-size:27px}.model{border:0;background:#303030;border-radius:22px;padding:12px 15px;font-weight:650;font-size:14px;max-width:185px}.send{width:45px;height:45px;border:0;border-radius:50%;background:var(--accent);font-size:21px}.voice{width:52px;height:52px;border:0;border-radius:50%;background:#f5f5f3;color:#111;display:grid;place-items:center}.wave{display:flex;align-items:center;gap:3px;height:24px}.wave b{display:block;width:3px;border-radius:3px;background:#111}.wave b:nth-child(1){height:9px}.wave b:nth-child(2){height:17px}.wave b:nth-child(3){height:23px}.wave b:nth-child(4){height:13px}.wave b:nth-child(5){height:19px}
.limit{display:none;background:#2b2b2b;border-radius:20px;padding:13px 16px;margin:0 0 9px;align-items:center;justify-content:space-between}.limit strong{display:block;font-size:15px}.limit small{color:#aaa}.upgrade{border:0;background:#444;border-radius:22px;padding:11px 16px;font-weight:700}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;z-index:5}.drawer.open{display:block}.side{width:82%;max-width:350px;height:100%;background:#202020;padding:24px 18px}.side h2{font-family:Georgia,serif;font-size:25px;margin:20px 10px 30px}.nav{display:block;width:100%;border:0;background:transparent;text-align:left;padding:15px 13px;border-radius:13px;font-size:16px}.nav:active,.nav.active{background:#303030}.new{margin-top:15px;background:#303030;border:0;width:100%;padding:14px;border-radius:14px;font-weight:700}.settings{margin-top:35px;color:var(--muted);font-size:13px;padding:10px}
@media(min-width:700px){.composerWrap{left:50%;transform:translateX(-50%);width:min(700px,100%)}.home{padding-top:80px}.greeting{font-size:46px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><button class="icon" id="menu" aria-label="Menu"><span class="hamb"><span></span><span></span><span></span></span></button><div class="brand">Claude</div><button class="icon ghost" id="profile" aria-label="Profile"><i></i></button></header>
<main class="home" id="home"><div class="mark"><div class="spark"> <i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i></div></div><div class="greeting" id="greeting">Up late, Tamil?</div><div class="sub">What can I help you with today?</div></main>
<section class="chat" id="chat"></section>
<div class="composerWrap"><div class="limit" id="limit"><div><strong>Usage status</strong><small id="limitText">Ready to chat</small></div><button class="upgrade" id="statusBtn">Puter AI</button></div><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Chat with Claude..."></textarea><div class="row"><div class="left"><button type="button" class="round" id="attach">+</button><select class="model" id="model"><option value="claude-sonnet-4-6">Sonnet 4.6</option><option value="claude-opus-4-1">Opus 4.1</option><option value="claude-haiku-4-5">Haiku 4.5</option></select></div><button type="button" class="voice" id="voice" aria-label="Voice"><span class="wave"><b></b><b></b><b></b><b></b><b></b></span></button><button type="submit" class="send" id="send" aria-label="Send">➤</button></div></form></div>
</div>
<div class="drawer" id="drawer"><aside class="side"><button class="icon" id="close" aria-label="Close">×</button><h2>Claude Mobile Pro</h2><button class="nav active" data-page="chat">✦ New chat</button><button class="nav" data-page="projects">▣ Projects</button><button class="nav" data-page="plugins">◇ Plugins</button><button class="nav" data-page="github">⌘ GitHub</button><button class="nav" data-page="settings">⚙ Settings</button><button class="new" id="newChat">+ New conversation</button><div class="settings">Powered by Puter.js<br>AI provider/model availability follows Puter's current service.</div></aside></div>
<script>
const $=id=>document.getElementById(id),home=$('home'),chat=$('chat'),input=$('input'),model=$('model'),form=$('form'),drawer=$('drawer');let messages=[];
function add(role,text){const d=document.createElement('div');d.className='msg '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;d.appendChild(b);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return b}
function startChat(){home.style.display='none';chat.style.display='block';input.focus()}
function reset(){messages=[];chat.innerHTML='';home.style.display='flex';chat.style.display='none';input.value=''}
form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;startChat();input.value='';messages.push({role:'user',content:text});add('user',text);const bubble=add('assistant','Thinking…');$('limit').style.display='flex';$('limitText').textContent='Connected to Puter AI';try{const r=await puter.ai.chat(messages,{model:model.value,stream:true});let out='';for await(const p of r){if(p.type==='text'){out+=p.text;bubble.textContent=out;chat.scrollTop=chat.scrollHeight}}messages.push({role:'assistant',content:out});$('limitText').textContent='Ready'}catch(err){bubble.textContent='Unable to generate a response: '+(err?.message||err);$('limitText').textContent='Check your connection or Puter session'}};
input.addEventListener('input',()=>{input.style.height='48px';input.style.height=Math.min(input.scrollHeight,130)+'px'});$('menu').onclick=()=>drawer.classList.add('open');$('close').onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};$('newChat').onclick=()=>{drawer.classList.remove('open');reset()};$('attach').onclick=()=>alert('Attachments can be added in the next native Android integration update.');$('voice').onclick=()=>alert('Voice input is not enabled in this build.');$('statusBtn').onclick=()=>alert('AI is provided through Puter.js.');$('profile').onclick=()=>drawer.classList.add('open');document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{if(n.dataset.page==='chat'){drawer.classList.remove('open');reset()}else alert(n.textContent.trim()+' is ready for the next feature build.')});
</script>
</body></html>
