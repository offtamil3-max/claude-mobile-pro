<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171716"><meta name="color-scheme" content="dark">
<title>Claude Mobile Pro</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--bg:#171716;--panel:#242423;--panel2:#2d2d2c;--text:#f2f0eb;--muted:#a7a49e;--accent:#d97757;--line:#353533;--keyboard:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}button,textarea,select{font:inherit}button{color:inherit;cursor:pointer}
.app{height:100dvh;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);background:var(--bg)}
.top{height:64px;min-height:64px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 14px;position:relative;z-index:2}.top .brand{text-align:center;font-family:Georgia,serif;font-size:19px;letter-spacing:-.4px}.icon{width:44px;height:44px;border:0;background:transparent;border-radius:14px;display:grid;place-items:center}.icon:active,.round:active,.voice:active{background:#30302f}.hamb{width:30px}.hamb span{display:block;width:29px;height:2px;background:#c9c6be;margin:6px 0;border-radius:2px}
.ghost{width:34px;height:34px;border:2px solid #eee;border-radius:50%;position:relative;justify-self:end}.ghost:before,.ghost:after{content:"";position:absolute;width:4px;height:4px;background:#eee;border-radius:50%;top:10px}.ghost:before{left:8px}.ghost:after{right:8px}.ghost i{position:absolute;width:12px;height:7px;border-bottom:2px solid #eee;border-radius:0 0 10px 10px;left:9px;top:15px}
.home{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 22px calc(185px + env(safe-area-inset-bottom));overflow:hidden}.mark{width:68px;height:68px;display:grid;place-items:center;margin-bottom:18px}.spark{position:relative;width:56px;height:56px}.ray{position:absolute;left:26px;top:0;width:5px;height:56px;border-radius:5px;background:var(--accent);transform-origin:50% 50%}.ray:nth-child(2){transform:rotate(30deg)}.ray:nth-child(3){transform:rotate(60deg)}.ray:nth-child(4){transform:rotate(90deg)}.ray:nth-child(5){transform:rotate(120deg)}.ray:nth-child(6){transform:rotate(150deg)}.ray:nth-child(7){transform:rotate(180deg)}.ray:nth-child(8){transform:rotate(210deg)}.ray:nth-child(9){transform:rotate(240deg)}.ray:nth-child(10){transform:rotate(270deg)}.ray:nth-child(11){transform:rotate(300deg)}.ray:nth-child(12){transform:rotate(330deg)}
.greeting{font-family:Georgia,serif;font-size:40px;line-height:1.1;text-align:center;letter-spacing:-1.7px;margin:0 0 10px}.sub{font-size:16px;color:var(--muted);text-align:center;line-height:1.45}.chat{display:none;flex:1;min-height:0;overflow:auto;padding:18px 18px calc(190px + env(safe-area-inset-bottom));scroll-behavior:smooth}.msg{display:flex;margin:12px 0}.msg.user{justify-content:flex-end}.bubble{max-width:88%;padding:12px 15px;border-radius:20px;white-space:pre-wrap;line-height:1.52;font-size:16px;overflow-wrap:anywhere}.assistant .bubble{background:transparent;padding-left:2px;max-width:95%}.user .bubble{background:#30302f}.typing{opacity:.7}
.composerWrap{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:0 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent 0,#171716 22%,#171716 100%);transition:transform .15s ease}.composer{background:#242423;border:1px solid #323230;border-radius:29px;padding:14px 13px 11px;box-shadow:0 10px 38px rgba(0,0,0,.28)}textarea{display:block;width:100%;height:46px;max-height:125px;border:0;outline:0;resize:none;overflow-y:auto;background:transparent;color:var(--text);font-size:18px;line-height:1.4;padding:3px 7px}textarea::placeholder{color:#aaa8a2}.row{display:flex;align-items:center;gap:10px;margin-top:7px}.left{display:flex;align-items:center;gap:9px;flex:1;min-width:0}.round{flex:0 0 44px;width:44px;height:44px;border:0;border-radius:50%;background:#30302f;display:grid;place-items:center;font-size:28px}.model{height:44px;border:0;outline:0;background:#30302f;border-radius:23px;padding:0 34px 0 16px;font-weight:650;font-size:14px;max-width:190px;color:#eee;appearance:auto}.voice{flex:0 0 52px;width:52px;height:52px;border:0;border-radius:50%;background:#f5f5f3;color:#111;display:grid;place-items:center}.wave{display:flex;align-items:center;gap:3px;height:24px}.wave b{display:block;width:3px;border-radius:3px;background:#111}.wave b:nth-child(1){height:9px}.wave b:nth-child(2){height:17px}.wave b:nth-child(3){height:23px}.wave b:nth-child(4){height:13px}.wave b:nth-child(5){height:19px}.send{flex:0 0 52px;width:52px;height:52px;border:0;border-radius:50%;background:var(--accent);font-size:25px;display:grid;place-items:center}.send:disabled{opacity:.45}.file{display:none}.attachment{display:none;margin:8px 3px 0;padding:9px 12px;border-radius:14px;background:#30302f;color:#c9c7c1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:7px;margin:0 8px 7px;font-size:12px;color:#aaa}.dot{width:7px;height:7px;border-radius:50%;background:#6fbf73}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10}.drawer.open{display:block}.side{width:min(84%,350px);height:100%;background:#20201f;padding:18px 16px env(safe-area-inset-bottom);box-shadow:12px 0 40px rgba(0,0,0,.35);overflow:auto}.sideTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.side h2{font-family:Georgia,serif;font-size:24px;margin:8px 10px 22px}.nav{display:block;width:100%;border:0;background:transparent;text-align:left;padding:14px 13px;border-radius:13px;font-size:16px}.nav:active,.nav.active{background:#30302f}.new{margin-top:16px;background:#30302f;border:0;width:100%;padding:14px;border-radius:14px;font-weight:700}.sideNote{margin:30px 10px;color:#92908b;font-size:12px;line-height:1.6}.modal{position:fixed;inset:0;display:none;z-index:20;background:rgba(0,0,0,.65);align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;background:#242423;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto}.sheet h3{margin:0 0 14px;font-size:19px}.sheet p{color:#aaa;line-height:1.5;font-size:14px}.sheet button{width:100%;border:0;background:#30302f;border-radius:13px;padding:13px;margin-top:8px;text-align:left}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#30302f;border:1px solid #44423e;padding:10px 14px;border-radius:14px;font-size:13px;transition:.2s;z-index:50;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:380px){.greeting{font-size:34px}.model{max-width:145px;padding-left:13px}.composerWrap{padding-left:10px;padding-right:10px}.voice,.send{flex-basis:48px;width:48px;height:48px}}
@media(min-width:700px){.composerWrap{left:50%;right:auto;transform:translateX(-50%);width:min(700px,100%)}.chat{width:min(760px,100%);margin:auto}.greeting{font-size:46px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><button class="icon" id="menu" aria-label="Menu"><span class="hamb"><span></span><span></span><span></span></span></button><div class="brand">Claude</div><button class="icon ghost" id="profile" aria-label="Profile"><i></i></button></header>
<main class="home" id="home"><div class="mark"><div class="spark"><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i></div></div><h1 class="greeting">Up late, Tamil?</h1><div class="sub">What can I help you with today?</div></main>
<section class="chat" id="chat" aria-live="polite"></section>
<div class="composerWrap" id="composerWrap"><div class="status"><span class="dot"></span><span id="statusText">Puter AI ready</span></div><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Chat with Claude..." autocomplete="off"></textarea><div class="attachment" id="attachment"></div><input class="file" id="file" type="file" accept="image/*,.pdf,.txt,.md,.json,.csv" multiple><div class="row"><div class="left"><button type="button" class="round" id="attach" aria-label="Attach">+</button><select class="model" id="model" aria-label="Model"><option value="claude-sonnet-4-6">Sonnet 4.6</option><option value="claude-opus-4-1">Opus 4.1</option><option value="claude-haiku-4-5">Haiku 4.5</option></select></div><button type="button" class="voice" id="voice" aria-label="Voice input"><span class="wave"><b></b><b></b><b></b><b></b><b></b></span></button><button type="submit" class="send" id="send" aria-label="Send">➤</button></div></form></div>
</div>
<div class="drawer" id="drawer"><aside class="side"><div class="sideTop"><span class="brand">Claude</span><button class="icon" id="close" aria-label="Close">×</button></div><h2>Claude Mobile Pro</h2><button class="nav active" data-page="chat">✦ New chat</button><button class="nav" data-page="projects">▣ Projects</button><button class="nav" data-page="plugins">◇ Plugins</button><button class="nav" data-page="github">⌘ GitHub</button><button class="nav" data-page="settings">⚙ Settings</button><button class="new" id="newChat">+ New conversation</button><div class="sideNote">A mobile-first AI workspace powered by Puter.js. Model availability follows Puter's current service.</div></aside></div>
<div class="modal" id="modal"><div class="sheet"><h3 id="modalTitle">Settings</h3><div id="modalBody"></div><button id="modalClose">Close</button></div></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);const home=$('home'),chat=$('chat'),input=$('input'),model=$('model'),form=$('form'),drawer=$('drawer'),file=$('file'),attachment=$('attachment'),modal=$('modal'),toast=$('toast');let messages=[];let selectedFiles=[];let speaking=false;
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2200)}
function add(role,text){const d=document.createElement('div');d.className='msg '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;d.appendChild(b);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return b}
function startChat(){home.style.display='none';chat.style.display='block'}
function reset(){messages=[];chat.innerHTML='';home.style.display='flex';chat.style.display='none';input.value='';input.style.height='46px';selectedFiles=[];attachment.style.display='none';attachment.textContent=''}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;modal.classList.add('open')}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;startChat();input.value='';input.style.height='46px';const prompt=selectedFiles.length?text+'\n\n[Attached: '+selectedFiles.map(f=>f.name).join(', ')+']':text;selectedFiles=[];attachment.style.display='none';messages.push({role:'user',content:prompt});add('user',text);if(prompt!==text)add('user','📎 '+prompt.slice(text.length).trim());const bubble=add('assistant','Thinking…');bubble.classList.add('typing');$('statusText').textContent='Generating…';$('send').disabled=true;try{if(typeof puter==='undefined'||!puter.ai)throw new Error('Puter AI is not loaded');const r=await puter.ai.chat(messages,{model:model.value,stream:true});let out='';for await(const p of r){if(p&&p.type==='text'){out+=p.text;bubble.textContent=out;chat.scrollTop=chat.scrollHeight}}bubble.classList.remove('typing');messages.push({role:'assistant',content:out||'(No text response)'});$('statusText').textContent='Puter AI ready'}catch(err){bubble.classList.remove('typing');bubble.textContent='Unable to generate a response. '+(err&&err.message?err.message:'Please try again.');$('statusText').textContent='Connection/problem — tap send to retry'}finally{$('send').disabled=false}});
input.addEventListener('input',()=>{input.style.height='46px';input.style.height=Math.min(input.scrollHeight,125)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>520){e.preventDefault();form.requestSubmit()}});
$('attach').onclick=()=>file.click();file.onchange=()=>{selectedFiles=[...file.files];if(!selectedFiles.length)return;attachment.textContent='📎 '+selectedFiles.map(f=>f.name).join(', ');attachment.style.display='block';showToast(selectedFiles.length+' file'+(selectedFiles.length>1?'s':'')+' attached')};
$('voice').onclick=()=>{if(speaking){if(window.AndroidBridge&&AndroidBridge.stopVoice)AndroidBridge.stopVoice();speaking=false;showToast('Voice stopped');return}if(window.AndroidBridge&&AndroidBridge.startVoice){speaking=true;AndroidBridge.startVoice();showToast('Listening…')}else if('webkitSpeechRecognition'in window||'SpeechRecognition'in window){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const rec=new SR();rec.lang='ta-IN';rec.interimResults=false;rec.onresult=e=>{input.value=(input.value+' '+e.results[0][0].transcript).trim();input.dispatchEvent(new Event('input'));};rec.onerror=()=>showToast('Voice input unavailable');rec.onend=()=>speaking=false;rec.start();speaking=true;showToast('Listening…')}else showToast('Voice input is not supported')};
window.setVoiceText=t=>{speaking=false;input.value=(input.value+' '+t).trim();input.dispatchEvent(new Event('input'));input.focus()};
$('menu').onclick=()=>drawer.classList.add('open');$('profile').onclick=()=>drawer.classList.add('open');$('close').onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};$('newChat').onclick=()=>{drawer.classList.remove('open');reset();showToast('New conversation')};$('modalClose').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{const p=n.dataset.page;drawer.classList.remove('open');if(p==='chat'){reset();return}if(p==='projects')openModal('Projects','<p>Your projects area is ready for local project organization.</p><button onclick="showToast(\'Project creation is ready\')">+ Create project</button>');if(p==='plugins')openModal('Plugins','<p>Plugin workspace for future tools and integrations.</p><button onclick="showToast(\'Plugin manager is ready\')">Browse plugins</button>');if(p==='github')openModal('GitHub','<p>Connect your GitHub workflow here. This build keeps credentials out of the app source.</p><button onclick="window.open(\'https://github.com/\',\'_blank\')">Open GitHub</button>');if(p==='settings')openModal('Settings','<p><b>Theme:</b> Dark</p><p><b>AI:</b> Puter.js</p><p><b>Model:</b> '+model.value+'</p><button onclick="localStorage.clear();showToast(\'Local chat data cleared\')">Clear local data</button>')});
window.addEventListener('resize',()=>{setTimeout(()=>{if(document.activeElement===input)chat.scrollTop=chat.scrollHeight},80)});
</script>
</body></html>
